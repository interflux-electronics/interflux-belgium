server {
    listen 80;
    listen [::]:80;

    server_name prototype.interflux.com;

    return 301 https://prototype.interflux.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name prototype.interflux.com;

    ssl_certificate             /etc/letsencrypt/live/prototype.interflux.com/fullchain.pem;
    ssl_certificate_key         /etc/letsencrypt/live/prototype.interflux.com/privkey.pem;

    # Modern TLS 2025–2026 (Mozilla intermediate + some extras)
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers   off;
    ssl_session_timeout         1d;
    ssl_session_cache           shared:MozSSL:10m;  # about 40000 sessions
    ssl_session_tickets         off;

    # Security headers (add to server or http block if you prefer globally)
    # add_header X-Content-Type-Options           "nosniff" always;
    # add_header X-Frame-Options                  "DENY" always;
    # add_header X-XSS-Protection                 "1; mode=block" always;
    # add_header Referrer-Policy                  "strict-origin-when-cross-origin" always;
    # add_header Permissions-Policy               "interest-cohort=()" always;
    # add_header Strict-Transport-Security        "max-age=63072000" always;   # enable after testing

    # STATIC ASSETS → serve directly, try precompressed

    location ~* ^/(assets|images|_app/immutable|favicon|.*\.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|eot|ttf|otf|webmanifest|json|xml))$ {
        root /var/www/prototype.interflux.com/build/client;

        try_files $uri $uri.br $uri.gz =404;

        gzip_static     on;
        expires         1y;
        access_log      off;
        add_header      Cache-Control "public, immutable";
    }

    # FINGERPRINTED ASSETS → cache aggressively

    location ~* ^/_app/immutable/ {
        expires         1y;
        add_header      Cache-Control "public, immutable";
    }

    # EVERYTHING ELSE → proxy to SvelteKit Node server

    location / {
        proxy_pass                  http://127.0.0.1:3000;
        proxy_http_version          1.1;
        proxy_set_header            Upgrade     $http_upgrade;
        proxy_set_header            Connection  "upgrade";
        proxy_set_header            Host        $host;
        proxy_set_header            X-Real-IP   $remote_addr;
        proxy_set_header            X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header            X-Forwarded-Proto $scheme;
        proxy_set_header            X-Forwarded-Host  $host;
        # proxy_set_header          X-Forwarded-Port  $server_port;   # sometimes needed

        proxy_read_timeout          90s;
        proxy_send_timeout          90s;

        # For large file uploads / long SSE / etc.
        proxy_buffer_size           128k;
        proxy_buffers               4 256k;
        proxy_busy_buffers_size     256k;
    }

    # 404 → fallback to index.html (for client-side routing)
    error_page 404 = @svelte_fallback;
    location @svelte_fallback {
        proxy_pass http://127.0.0.1:3000;
    }
}