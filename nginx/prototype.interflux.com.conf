# Declared in the Nginx config of the Interflux API
# upstream api_interflux_com
# {
#   server unix:/var/www/api.interflux.com/tmp/sockets/puma.sock fail_timeout=0;
# }

upstream prototype_interflux_com {
    server unix:/run/prototype.interflux.com/app.sock;
}

server {
    listen 80;
    listen [::]:80;

    server_name prototype.interflux.com;

    access_log /var/log/prototype.interflux.com/nginx-access.log;
    error_log  /var/log/prototype.interflux.com/nginx-error.log;

    return 301 https://prototype.interflux.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    
    http2 on;

    server_name prototype.interflux.com;

    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    ssl_certificate     /etc/letsencrypt/live/prototype.interflux.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prototype.interflux.com/privkey.pem;

    access_log /var/log/prototype.interflux.com/nginx-access.log;
    error_log  /var/log/prototype.interflux.com/nginx-error.log;

    client_max_body_size 25m;

    # Hashed files 
    # Cached for 1 year
    location /_app/immutable/ {
        root /var/www/prototype.interflux.com/build/client;
        gzip_static on;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # Unhashed files
    # Cached for 1 hour
    # For example: static/robots.txt, static/favicon.ico, ...
    location / {
        root /var/www/prototype.interflux.com/build/client;
        gzip_static on;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
        # IMPORTANT: if not static file is found, then fall through to the Svelte Kit app
        try_files $uri @app;
    }

    # The Svelte Kit frontend 
    # Served via socket (not port)
    # Can only be reached via the above location /
    location @app {
        proxy_pass http://prototype_interflux_com;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # The Rails backend
    # Served via socket (not port)
    # All requests that start with /api will be redirected to the backend.
    # The upstream is declared in the Nginx config of the ROA API.
    # Do not declare it again in this file.
    # Thehe /api prefix is stripped:
    # /api/v1/public/products in Nginx becomes /v1/public/products in Rails
    location /api/ {
        proxy_pass http://api_interflux_com/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }
}
